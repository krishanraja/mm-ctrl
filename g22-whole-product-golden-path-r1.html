<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0a100d">
  <title>CTRL whole-product proof | Synthetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/g22-whole-product-golden-path-r1.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="identity">
        <img class="brand-icon" src="/mindmaker-favicon.png" alt="Mindmake">
        <span class="avatar" aria-hidden="true">MC</span>
        <span class="person"><strong>Maya Chen</strong><span>Founder and CEO · Aperture House</span></span>
      </div>
      <div class="top-actions">
        <span class="proof-label">Synthetic proof</span>
        <button class="quiet-button" id="history-button" type="button">History</button>
        <button class="quiet-button" id="brain-button" type="button">Living Brain</button>
      </div>
    </header>

    <main id="work-region" tabindex="-1" aria-live="polite"></main>
  </div>

  <div class="overlay" id="overlay" hidden>
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title"></h2>
        <button class="icon-button" id="drawer-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="drawer-content"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/g22-whole-product-golden-path-r1.js"></script>
</body>
</html>
