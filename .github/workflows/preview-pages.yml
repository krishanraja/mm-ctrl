name: synthetic preview pages

on:
  push:
    branches:
      - codex/g20-context-exchange-proof
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: synthetic-preview-pages
  cancel-in-progress: true

jobs:
  build:
    name: build synthetic preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Install locked dependencies
        run: npm ci

      - name: Build the unlinked synthetic product proof
        env:
          ROLLUP_DISABLE_NATIVE: '1'
          VITE_ENABLE_SYNTHETIC_DECISION_BENCH: '1'
        run: npx vite build --base=/mm-ctrl/

      - name: Preserve client-side routes on direct mobile opens
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload the exact built artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  deploy:
    name: deploy synthetic preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e


